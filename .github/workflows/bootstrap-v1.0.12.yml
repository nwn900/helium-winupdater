name: Bootstrap v1.0.12 release

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/bootstrap-v1.0.12.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch release workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release-v1.0.12.yml --repo ${{ github.repository }} --ref master
